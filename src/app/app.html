@let customer = data();
@let customerStatus = customer.status;
<div class="mx-auto px-4 py-6">
  <h1 class="text-3xl font-bold">Change Detection</h1>
  <div class="grid grid-cols-2 items-center gap-6">
    <div>
      <p class="font-medium">First Name</p>
      <p>{{ customer.firstName }}</p>
    </div>
    <div>
      <p class="font-medium">Last Name</p>
      <p>{{ customer.lastName }}</p>
    </div>
    <div>
      <p class="font-medium">Email Address</p>
      <p>{{ customer.emailAddress }}</p>
    </div>
    <div>
      <span class="rounded font-medium p-1"
            [ngClass]="getStatus(customerStatus)">{{ customerStatus | uppercase }}</span>
    </div>

    <div class="col-span-2 flex justify-end">
      <button
        class="px-4 py-2 rounded-lg text-white font-medium shadow-md transition-colors"
        [class.bg-red-400]="customerStatus === 'active'"
        [class.bg-green-400]="customerStatus === 'inactive'"
        (click)="markAsInactive()">
        {{ customerStatus === 'active' ? 'Deactivate Customer' : 'Active Customer' }}
      </button>
    </div>
  </div>
</div>
