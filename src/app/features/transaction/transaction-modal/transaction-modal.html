<div class="flex flex-col h-full">
  <header class="bg-white border-b border-gray-200 flex-shrink-0">
    <div class="px-4 h-14 flex items-center justify-between">
      <div class="flex items-center">
        <button
          class="text-gray-600 hover:text-gray-800 font-medium px-3 py-2 rounded-lg transition-colors duration-200"
          (click)="cancel()"
        >
          Cancel
        </button>
      </div>

      <h2 class="text-lg font-semibold text-gray-900 absolute left-1/2 transform -translate-x-1/2">
        Welcome
      </h2>

      <div class="flex items-center">
        <button
          class="text-blue-600 hover:text-blue-700 font-semibold px-3 py-2 rounded-lg transition-colors duration-200"
          (click)="confirm()"
        >
          Confirm
        </button>
      </div>
    </div>
  </header>

  <div class="flex-1 overflow-auto p-4">
    <div class="space-y-2">
      <label class="block text-sm font-medium text-gray-700">
        Enter your name
      </label>
      <input
        type="text"
        [(ngModel)]="name"
        placeholder="Your name"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors duration-200"
      />
    </div>
  </div>
</div>
`
